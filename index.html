<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Activity 2 - About Me</title>
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            }

        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            position: relative;
        }

        
        #bg-video {
            position: absolute;
            top: 50%;
            left: 50%;
            min-width: 100%;
            min-height: 100%;
            width: auto;
            height: auto;
            z-index: -2;
            transform: translate(-50%, -50%);
            object-fit: cover;
        }

      
        .video-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.35);
            z-index: -1;
        }

        .card {
            background: rgba(240, 180, 239, 0.92);
            backdrop-filter: blur(8px);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
            text-align: center;
            max-width: 420px;
            width: 90%;
            margin: 20px;
        }

        
        .profile-img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #8a2be2;
            margin-bottom: 12px;
        }

        h1 {
            color: #4a154b;
            font-size: 24px;
            margin-bottom: 5px;
        }

        .quote {
            font-style: italic;
            color: #333333;
            background: #cdaeef;
            border-left: 4px solid #8a2be2;
            padding: 8px 12px;
            margin: 12px 0;
            font-size: 13px;
            border-radius: 4px;
        }

        .bio-text {
            color: #444444;
            font-size: 14px;
            line-height: 1.6;
            margin: 12px 0;
            text-align: left;
        }

        .badge {
            background-color: #8a2be2;
            color: white;
            padding: 6px 14px;
            border-radius: 15px;
            font-size: 12px;
            display: inline-block;
            margin-top: 10px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    
    <video autoplay loop muted playsinline id="bg-video">
        <source src="violet.mp4" type="video/mp4">
        
    </video>
    <div class="video-overlay"></div>

    
    <div class="card">
        <img src="Barlongo.jpg" alt="Mishigel Barlongo" class="profile-img">

        <h1>Mishigel Barlongo</h1>
        
        <div class="quote">
            "I didn't make it this far just to give up now."
        </div>

        <div class="bio-text">
            <p><strong>Age:</strong> 19</p>
            <p><strong>City:</strong> Baguio City</p>
            <p><strong>School:</strong> University of Baguio</p>
            <p><strong>Major:</strong> Human-Computer Interaction / IT</p>
            <p><strong>Hobbies:</strong> listening to music, reading books and watching movies </p>
        </div>
<span class="badge">Status: Live & Configured</span>

        <!-- Next button to Activity 3 -->
        <nav style="margin-top: 15px;">
            <a class="badge" style="background-color: #8a2be2; text-decoration: none; padding: 8px 16px; font-size: 13px;" href="Activity3_AboutMe_Barlongo.html">Next: About Me as a Student &rarr;</a>
        </nav>
    </div>

</body>
</html>
</body>
</html>
