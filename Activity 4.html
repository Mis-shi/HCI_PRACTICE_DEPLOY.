<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Activity 4 - Stay Connected</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            position: relative;
        }

        #bg-video {
            position: fixed;
            top: 50%;
            left: 50%;
            min-width: 100%;
            min-height: 100%;
            width: auto;
            height: auto;
            z-index: -2;
            transform: translate(-50%, -50%);
            object-fit: cover;
        }

        .video-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(20, 10, 35, 0.55);
            z-index: -1;
        }

        .container {
            width: 100%;
            max-width: 460px;
            padding: 20px;
            text-align: center;
        }

        h1 {
            color: #ffffff;
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 25px;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.4);
        }

        .social-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 14px;
            margin-bottom: 25px;
            padding: 0;
        }

        .social-list li a {
            display: flex;
            align-items: center;
            gap: 15px;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            color: #ffffff;
            padding: 14px 20px;
            border-radius: 12px;
            text-decoration: none;
            font-size: 15px;
            font-weight: 500;
            border: 1px solid rgba(255, 255, 255, 0.25);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            transition: all 0.3s ease;
        }

        .social-list li a:hover {
            background: rgba(255, 255, 255, 0.28);
            transform: translateY(-2px);
            border-color: rgba(255, 255, 255, 0.5);
        }

        .social-list li a i {
            font-size: 20px;
            width: 24px;
            text-align: center;
        }

        .back-btn {
            display: inline-block;
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(8px);
            color: #ffffff;
            padding: 8px 32px;
            border-radius: 20px;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            border: 1px solid rgba(255, 255, 255, 0.4);
            transition: all 0.2s ease;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.2);
        }

        .back-btn:hover {
            background: rgba(255, 255, 255, 0.6);
            color: #1a0033;
        }
    </style>
</head>
<body>

    <video autoplay loop muted playsinline id="bg-video">
        <source src="violet.mp4" type="video/mp4">
        
    </video>
    <div class="video-overlay"></div>

    <div class="container">
        <h1>Stay Connected!</h1>

        
        <ul class="social-list">
            <li>
                <a href="https://instagram.com" target="_blank">
                    <i class="fa-brands fa-instagram"></i>
                    <span>Follow my adventures on Instagram!</span>
                </a>
            </li>
            <li>
                <a href="https://facebook.com" target="_blank">
                    <i class="fa-brands fa-facebook"></i>
                    <span>Discover more on my Facebook!</span>
                </a>
            </li>
            <li>
                <a href="https://tiktok.com" target="_blank">
                    <i class="fa-brands fa-tiktok"></i>
                    <span>Watch my videos on TikTok!</span>
                </a>
            </li>
            <li>
                <a href="https://spotify.com" target="_blank">
                    <i class="fa-brands fa-spotify"></i>
                    <span>Listen to my playlists on Spotify!</span>
                </a>
            </li>
            <li>
                <a href="https://youtube.com" target="_blank">
                    <i class="fa-brands fa-youtube"></i>
                    <span>Dive deeper into my channel on YouTube!</span>
                </a>
            </li>
        </ul>

        
        <a href="Activity3_AboutMe_Barlongo.html" class="back-btn">Back</a>
    </div>

</body>
</html>
